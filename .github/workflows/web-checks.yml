name: Web checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows launch protocol input
        shell: pwsh
        run: |
          $proof = Join-Path $env:RUNNER_TEMP 'studio-launch-tests.exe'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /main:LaunchLinkTests /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "/out:$proof" (Join-Path $PWD 'native\m5-studio-launcher\Studio.cs') (Join-Path $PWD 'native\m5-studio-launcher\LaunchLinkTests.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher test compilation failed' }
          & $proof
          if ($LASTEXITCODE -ne 0) { throw 'Launcher protocol tests failed' }
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build:m4-renderer
      - name: Build mock website
        run: npm run build
        env:
          CURLCAST_MODE: mock
          NEXT_PUBLIC_CURLCAST_MODE: mock
          ROLE_TOKEN_SECRET: curlcast-playwright-only-secret-32-chars
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: playwright-public-placeholder
          SUPABASE_SECRET_KEY: playwright-server-placeholder
      - run: npx playwright install --with-deps chromium
      - name: Browser integration with local API fixtures
        run: npm run test:e2e
        env:
          CURLCAST_MODE: mock
          NEXT_PUBLIC_CURLCAST_MODE: mock
